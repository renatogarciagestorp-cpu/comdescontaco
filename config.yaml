# ============ Identidade do canal ============
canal:
  nome: "comdescontaco"
  arroba_telegram: "@comdescontaco"      # troque se o @ já estiver em uso
  link_telegram: "https://t.me/comdescontaco"
  arroba_instagram: "@comdescontaco"
  aviso_afiliado: "Links de afiliado: podemos ganhar comissão, sem custo extra pra você."

cores:
  fundo: "#1E0742"      # roxo-noite: faz o produto e o preço "saltarem"
  fundo2: "#4A12A0"     # roxo vibrante (degradê e brilho atrás do produto)
  destaque: "#FFD60A"   # amarelo: preço e botão (maior atenção visual)
  alerta: "#FF1F4B"     # vermelho: % de desconto e urgência
  ganho: "#2EF2A0"      # verde: economia (sensação de ganho)
  texto: "#FFFFFF"
  suave: "#C9B8F2"      # textos secundários

# ============ Busca de ofertas (Shopee) ============
busca:
  # Nicho geral: a cada execução o bot sorteia algumas palavras desta lista.
  palavras_chave:
    - fone bluetooth
    - smartwatch
    - air fryer
    - organizador
    - tênis
    - perfume
    - carregador turbo
    - mochila
    - luminária led
    - panela
    - garrafa térmica
    - kit maquiagem
    - brinquedo
    - ferramentas
    - capa celular
    - camiseta
    - aspirador
    - caixa de som
    - cozinha utilidades
    - pet
  palavras_por_execucao: 4
  resultados_por_palavra: 30

filtros:
  desconto_minimo: 30        # %
  nota_minima: 4.6           # estrelas
  vendas_minimas: 100
  preco_maximo: 800          # R$ (nicho geral converte melhor em itens baratos)
  repetir_produto_apos_dias: 7

publicacao:
  posts_por_execucao: 2          # o GitHub roda a cada ~30 min → ~4 posts/hora
  intervalo_segundos_entre_posts: 60
  # Posta 24h. Neste intervalo (horário de Brasília) os posts saem SEM SOM de notificação,
  # para não incomodar quem dorme e evitar que silenciem o canal. Use [] para sempre tocar.
  madrugada_sem_som: [0, 7]
  campanha_shopee_a_cada_horas: 6  # posta uma campanha/cupom oficial da Shopee
  instagram_posts_por_dia: 8       # só os melhores vão pro Instagram

# ============ Instagram ============
instagram:
  conteudo_em_reels: true     # o post de conteúdo diário sai como Reel (vídeo) + Story
  reels_ofertas_por_dia: 2    # as 2 melhores ofertas do dia viram Reel; as demais saem como imagem
  stories_ofertas: true       # cada oferta publicada no Instagram também vira Story
  # Música: coloque .mp3 livres de direitos em assets/audio/ (ex.: Biblioteca de Áudio do YouTube)
