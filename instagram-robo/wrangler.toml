name = "comdescontaco-instagram"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
LINKS_URL = "https://raw.githubusercontent.com/renatogarciagestorp-cpu/comdescontaco/main/data/instagram_links.json"
TELEGRAM_LINK = "https://t.me/comdescontaco"

# Segredos (NÃO coloque aqui). Cadastre com:
#   npx wrangler secret put INSTAGRAM_TOKEN
#   npx wrangler secret put INSTAGRAM_USER_ID
#   npx wrangler secret put APP_SECRET
#   npx wrangler secret put VERIFY_TOKEN

# Varre os comentários a cada minuto (a Meta só manda webhook de comentário após o app ser aprovado)
[triggers]
crons = ["* * * * *"]
