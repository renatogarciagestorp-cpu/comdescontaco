<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conta conectada - comdescontaco</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;background:#1e0742;color:#fff;text-align:center}h1{color:#ffd60a}a{color:#ffd60a}</style></head>
<body>
<h1 id="t">⚡ Conta conectada!</h1>
<p id="m">O Instagram foi conectado ao comdescontaco. Já pode fechar esta janela.</p>
<p><a href="index.html">Voltar ao início</a></p>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("error")) {
    document.getElementById("t").textContent = "Conexão cancelada";
    document.getElementById("m").textContent = "A conexão não foi concluída. Você pode tentar de novo quando quiser.";
  }
</script>
</body></html>
