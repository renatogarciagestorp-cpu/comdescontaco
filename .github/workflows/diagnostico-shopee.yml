name: Diagnóstico Shopee

on:
  workflow_dispatch:
    inputs:
      palavra:
        description: "Palavra de busca"
        required: false
        default: "mochila notebook"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: python -m bot.diag_shopee "${{ github.event.inputs.palavra }}"
