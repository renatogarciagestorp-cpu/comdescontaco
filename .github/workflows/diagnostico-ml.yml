name: Diagnóstico Mercado Livre

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link do Mercado Livre para analisar"
        required: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot.diag_ml "${{ github.event.inputs.url }}"
