name: Diagnóstico vitrine Mercado Livre

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link meli.la de afiliado ou endereços da vitrine (separados por espaço)"
        required: true
      modo:
        description: "1 = rastreio do link; 2 = itens da vitrine"
        required: false
        default: "1"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow pyyaml
      - run: |
          if [ "${{ github.event.inputs.modo }}" = "2" ]; then
            python -m bot.diag_vitrine2 ${{ github.event.inputs.url }}
          else
            python -m bot.diag_vitrine "${{ github.event.inputs.url }}"
          fi
