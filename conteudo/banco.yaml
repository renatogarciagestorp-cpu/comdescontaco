# Banco de conteúdo do Instagram (posts que NÃO são ofertas).
# O robô publica 1 por dia, na ordem, no feed + Stories (workflow "Conteúdo Instagram").
# "publicar_em" (opcional): o post sai exatamente nesse dia, furando a fila.
# Tipos: "lista" (título + itens), "texto" (título + parágrafo), "contagem" (dias até uma data).
# Em "titulo", as linhas listadas em "destaque" (começando em 0) saem em amarelo.
# Objetivo de cada post (pilar): ALCANCE = compartilhamento/salvamento, ENGAJAMENTO = comentário,
# CONFIANÇA = autoridade, CONVERSÃO = levar ao Telegram.

posts:
  - id: bf-sinais-desconto-falso
    pilar: ALCANCE
    tipo: lista
    etiqueta: BLACK FRIDAY
    titulo: ["5 SINAIS DE", "DESCONTO FALSO"]
    destaque: [1]
    itens:
      - ["O preço subiu antes", "Desconfie do 'de' que aumentou semanas atrás"]
      - ["Frete caro escondido", "Some o frete antes de comemorar o desconto"]
      - ["Loja sem avaliações", "Prefira vendedores com histórico e notas altas"]
      - ["Urgência exagerada", "'Só hoje' todo dia não é oferta, é pressão"]
      - ["Link estranho", "Compre só pelo site ou app oficial da loja"]
    cta: SALVE E COMPARTILHE
    legenda: |
      🚨 Black Friday chegando e com ela os "descontos" que não são descontos.

      Antes de comprar, confira estes 5 sinais 👆

      Aqui no @comdescontaco a gente só divulga oferta que passa no nosso filtro: desconto real, produto bem avaliado e vendedor com histórico.

      📌 Salve este post pra consultar na Black Friday
      📲 Ofertas verificadas todos os dias no nosso Telegram (link na bio)

      #blackfriday #blackfriday2026 #promoção #desconto #achadinhos #dicasdecompras #economia

